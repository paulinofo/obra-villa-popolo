<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Villa Popolo · pisos</title>
<style>
  :root{
    --tinta:#1b1f24; --suave:#6b7280; --linea:#dcdfe4; --fondo:#f6f6f4;
    --papel:#ffffff; --acento:#b0713a; --acento-claro:#f3e6da;
    --arriba:env(safe-area-inset-top,0px); --abajo:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       color:var(--tinta);background:var(--fondo);overflow:hidden;
       display:flex;flex-direction:column}

  header{padding:calc(var(--arriba) + 10px) 14px 0;background:var(--papel);
         border-bottom:1px solid var(--linea);flex:0 0 auto}
  h1{font-size:17px;font-weight:600;letter-spacing:.01em}
  h1 span{color:var(--suave);font-weight:400}
  .estado{font-size:12px}
  .estado.vivo{color:#2f7d4f}
  .estado.malo{color:#b0713a}
  .gasto{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--linea);
         cursor:pointer;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:8px}
  /* El que se está corrigiendo se queda marcado mientras lo editas abajo. */
  .gasto.editando{background:var(--acento-claro);box-shadow:inset 0 0 0 1px var(--acento)}
  .gasto .dia{font-size:11px;color:var(--suave);width:46px;flex:0 0 auto}
  .gasto .qué{flex:1}
  .gasto .quien{font-size:11.5px;color:var(--suave)}
  /* El dueño del gasto se corrige aquí mismo: menú que parece texto. */
  .quienSel{font:inherit;font-size:11.5px;color:var(--acento);background:none;border:0;
            padding:0 14px 0 2px;-webkit-appearance:none;appearance:none;cursor:pointer;
            background-image:linear-gradient(45deg,transparent 50%,var(--acento) 50%),
                             linear-gradient(135deg,var(--acento) 50%,transparent 50%);
            background-position:right 5px top .45em,right 1px top .45em;
            background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .quienSel.pendiente{font-weight:600}
  .gasto .monto{font-variant-numeric:tabular-nums;font-weight:600}
  .campo{display:block;margin:9px 0 0;font-size:12.5px;color:var(--suave)}
  .campo input,.campo select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--linea);
    border-radius:9px;font:inherit;font-size:14px;background:var(--fondo);color:var(--tinta)}
  .dosCampos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .menu a{display:flex;justify-content:space-between;padding:12px 0;color:var(--tinta);
          text-decoration:none;border-top:1px solid var(--linea)}
  .menu a:first-child{border-top:0}
  .menu a span{color:var(--suave)}
  .atras{display:inline-block;margin-bottom:10px;color:var(--acento);text-decoration:none;font-size:13px}
  /* Pestañas: la activa va RELLENA, no sólo subrayada. La rayita de 2 px no se
     veía en el teléfono y uno no sabía en qué pantalla estaba. Ya no son cinco
     columnas iguales: cada pastilla mide lo que dice y la fila rueda si no cabe,
     así ninguna etiqueta se aplasta. */
  nav{display:flex;gap:4px;margin-top:10px;padding-bottom:8px;
      overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:8px 12px;border:0;border-radius:9px;background:none;
             font:inherit;font-size:12.5px;line-height:1.15;color:var(--suave);
             white-space:nowrap;cursor:pointer}
  nav button[aria-selected="true"]{background:var(--acento);color:#fff;font-weight:600}
  /* Los dos niveles del plano son una cosa; Resumen, Gastos y Más son otra. */
  nav .aparte{flex:0 0 auto;align-self:stretch;width:1px;margin:4px 5px;background:var(--linea)}

  main{flex:1;position:relative;overflow:hidden}
  #resumen{overflow-x:hidden}
  .vista{position:absolute;inset:0;display:none}
  .vista.activa{display:block}

  #lienzo{width:100%;height:100%;display:block;touch-action:none}
  .flotante{position:absolute;right:12px;bottom:calc(12px + var(--abajo));display:flex;
            flex-direction:column;gap:6px}
  .flotante button{width:40px;height:40px;border-radius:12px;border:1px solid var(--linea);
                   background:var(--papel);font-size:17px;color:var(--tinta);cursor:pointer;
                   box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .aviso{position:absolute;left:12px;right:64px;bottom:calc(12px + var(--abajo));
         background:var(--papel);border:1px solid var(--linea);border-radius:12px;
         padding:9px 12px;font-size:12.5px;color:var(--suave);
         box-shadow:0 1px 4px rgba(0,0,0,.06)}

  /* ---- resumen ---- */
  #resumen,#gastos,#mas{overflow-y:auto;padding:14px 14px calc(28px + var(--abajo))}
  .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:14px;
           padding:12px 14px;margin-bottom:12px;overflow-x:auto}
  .tarjeta h2{font-size:13px;font-weight:600;color:var(--suave);text-transform:uppercase;
              letter-spacing:.05em;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:right;font-weight:500;color:var(--suave);font-size:10.5px;padding:0 0 6px 6px;
     text-transform:uppercase;letter-spacing:.02em;line-height:1.25}
  th:first-child{text-align:left}
  td{padding:7px 0 7px 3px;border-top:1px solid var(--linea);text-align:right;
     font-variant-numeric:tabular-nums;white-space:nowrap}
  td:first-child{white-space:normal}
  td:first-child{text-align:left}
  tr.total td{font-weight:600;border-top:2px solid var(--tinta)}
  tr.detalle td{border-top:0;padding:0 0 8px;text-align:left;font-size:11.5px;
                color:var(--suave);line-height:1.5}
  .muestra{display:inline-block;width:11px;height:11px;border-radius:3px;
           border:1px solid rgba(0,0,0,.18);margin-right:7px;vertical-align:-1px}
  .nada{color:var(--suave)}
  /* el precio más bajo de cada rubro, para que salte a la vista */
  .barato{font-weight:600;color:var(--acento)}
  td input.pu{width:74px;padding:6px 8px;border:1px solid var(--linea);border-radius:8px;
                  font:inherit;font-size:12px;text-align:right;background:var(--papel);
                  font-variant-numeric:tabular-nums}
  /* Con tres o más columnas la tabla se sale de un teléfono: anchos fijos y
     el nombre del rubro parte renglón en vez de empujar. */
  table.comparar{table-layout:fixed}
  table.comparar td:first-child,table.comparar th:first-child{width:42%;overflow-wrap:anywhere}
  table.cotiza td:last-child{white-space:normal}
  .interruptor{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-top:4px}
  .interruptor input{width:18px;height:18px;accent-color:var(--acento)}
  .escoger{margin-top:12px;border-top:1px solid var(--linea);padding-top:10px}
  /* Anchos fijos: si no, un nombre largo empuja la tabla y desborda la página. */
  .escoger table{table-layout:fixed}
  .escoger td:first-child{white-space:normal;overflow-wrap:anywhere}
  .escoger th:nth-child(2),.escoger td:nth-child(2){width:48px}
  .escoger th:nth-child(3),.escoger td:nth-child(3),
  .escoger th:nth-child(4),.escoger td:nth-child(4){width:32px}
  .escoger summary{font-size:12.5px;color:var(--acento);cursor:pointer;list-style:none}
  .escoger summary::-webkit-details-marker{display:none}
  .escoger summary::before{content:"▸ "}
  .escoger[open] summary::before{content:"▾ "}
  .marca{width:24px;height:24px;border:1px solid var(--linea);border-radius:6px;
         background:var(--papel);font:inherit;font-size:13px;color:var(--acento);cursor:pointer;
         padding:0}
  .marca[aria-pressed="true"]{background:var(--acento-claro);border-color:var(--acento)}
  /* Seis columnas en 390 px de teléfono: los campos van justos a propósito. */
  .precio{width:44px;padding:4px 5px;border:1px solid var(--linea);border-radius:6px;
          font:inherit;font-size:12px;text-align:right;background:var(--fondo)}
  .fila-merma{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .fila-merma input{width:52px}
  .guia{font-size:12.5px;color:var(--suave);margin-top:9px}
  .tira{height:44px;border-radius:9px;border:1px solid rgba(0,0,0,.14);margin-bottom:10px}
  .btn{display:block;width:100%;padding:11px;border:1px solid var(--linea);border-radius:11px;
       background:var(--papel);font:inherit;font-size:14px;color:var(--tinta);cursor:pointer}
  .btn.fuerte{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .btn.malo{color:#a3342b;border-color:#e6c4bf}

  /* ---- ficha del espacio ---- */
  #velo{position:fixed;inset:0;background:rgba(20,22,26,.34);opacity:0;pointer-events:none;
        transition:opacity .18s}
  #velo.abierto{opacity:1;pointer-events:auto}
  #ficha{position:fixed;left:0;right:0;bottom:0;background:var(--papel);
         border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--abajo));
         transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
         max-height:86%;overflow-y:auto;box-shadow:0 -6px 28px rgba(0,0,0,.14)}
  #ficha.abierto{transform:none}
  .jalador{width:36px;height:4px;border-radius:2px;background:var(--linea);margin:0 auto 12px}
  .nombre{font-size:19px;font-weight:600;border:0;border-bottom:1px dashed var(--linea);
          width:100%;font-family:inherit;padding:2px 0 4px;background:none;color:var(--tinta)}
  .metros{font-size:13.5px;color:var(--suave);margin:8px 0 16px}
  .metros b{color:var(--tinta);font-weight:600}
  .tipos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tipo{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--linea);
        border-radius:11px;background:var(--papel);font:inherit;font-size:13.5px;text-align:left;
        cursor:pointer;color:var(--tinta)}
  .tipo[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-claro);
                             box-shadow:inset 0 0 0 1px var(--acento)}
  .tipo .muestra{width:15px;height:15px;margin:0;flex:0 0 auto}
  .trabajos{margin-top:16px;display:grid;gap:8px}
  .trabajos .guia{margin:0 0 2px}
  @media (min-width:640px){ .tipos{grid-template-columns:repeat(3,1fr)}
    #ficha{left:50%;right:auto;width:560px;transform:translate(-50%,102%);border-radius:20px 20px 0 0}
    #ficha.abierto{transform:translate(-50%,0)} }
</style>
</head>
<body>
<header>
  <h1>Villa Popolo <span id="estado" class="estado"></span></h1>
  <nav id="pestanas" role="tablist" aria-label="Pantallas">
    <button role="tab" data-vista="pb" aria-controls="vista-mapa" aria-selected="true">Abajo</button>
    <button role="tab" data-vista="n1" aria-controls="vista-mapa" aria-selected="false">Arriba</button>
    <span class="aparte" aria-hidden="true"></span>
    <button role="tab" data-vista="resumen" aria-controls="resumen" aria-selected="false">Resumen</button>
    <button role="tab" data-vista="gastos" aria-controls="gastos" aria-selected="false">Gastos</button>
    <button role="tab" data-vista="mas" aria-controls="mas" aria-selected="false">Más</button>
  </nav>
</header>

<main>
  <div class="vista activa" id="vista-mapa">
    <canvas id="lienzo"></canvas>
    <div class="aviso" id="aviso"></div>
    <div class="flotante">
      <button id="acercar" title="Acercar">+</button>
      <button id="menos" title="Alejar">−</button>
      <button id="ajustar" title="Ajustar">⤢</button>
    </div>
  </div>
  <div class="vista" id="resumen"></div>
  <div class="vista" id="gastos"></div>
  <div class="vista" id="mas"></div>
</main>

<div id="velo"></div>
<div id="ficha">
  <div class="jalador"></div>
  <input class="nombre" id="f-nombre" autocomplete="off">
  <p class="metros" id="f-metros"></p>
  <div class="tipos" id="f-tipos"></div>
  <div class="trabajos" id="f-trabajos"></div>
</div>

const INGENIERIA = {

const TIPOS_BASE = [

]
const vacio = () => ({ piso:{}, nombre:{}, precio:{}, mo:{}, merma:10, hecho:{}, trabajo:{},
                       gastos:{}, notas:{}, cfg:{}, abierto:false,
                       rubros:{}, avances:{}, materiales:{}, dudas:{},
                       candidatos:{}, cotiza:{} })
/* ------------------------------------------------------------------
   Hechos. Un hecho es {k, v, t}: llave, valor y sello. Gana el sello mayor.
   Es la ÚNICA puerta por la que entra dato — lo que tecleas aquí y lo que
   baja del servidor pasan por el mismo sitio. Debajo sigue viviendo `S`,
   que es sólo la forma cómoda de leerlos: se rehace cada vez que cambian. */
const T = { h:Object.create(null), ct:Object.create(null), cola:[], clave:'', sala:'' }
let S = vacio()

function aplicar (k, v, t) {
  if (t <= (T.ct[k] || 0)) return false
  T.ct[k] = t
  if (v === null || v === undefined) delete T.h[k]; else T.h[k] = v
  return true
}
/* Lo que nace en este teléfono: se aplica y se encola para subir. El sello
   sube al menos un milisegundo sobre el anterior, porque dos escrituras a la
   misma llave dentro del mismo milisegundo perderían la segunda. */
const TOPE_LLAVE = 16            // lo que el servidor guarda de la llave
function pon (k, v) {
  if (k.length > TOPE_LLAVE) { console.error('llave muy larga, se cortaría:', k); return false }
  const t = Math.max(Date.now(), (T.ct[k] || 0) + 1)
  if (!aplicar(k, v, t)) return false
  T.cola.push({ k, v, t })
  desdeHechos(); guarda(); programarSync(600)
  return true
}
const fusiona = (hechos) => hechos.reduce((n, x) => n + (aplicar(x.k, x.v, x.t) ? 1 : 0), 0)

/* Del montón de hechos a la forma que lee el resto de la app. */
function desdeHechos () {
  const n = vacio()
  n.merma = 10
  for (const k in T.h) {
    const v = T.h[k], cual = k.slice(0, 2), resto = k.slice(2)
    if (k === 'merma') n.merma = v
    else if (cual === 'p:') n.piso[resto] = v
    else if (cual === 'm:') n.nombre[resto] = v
    else if (cual === 'a:') (n.trabajo.aplanado = n.trabajo.aplanado || {})[resto] = v
    else if (cual === 'q:') (n.trabajo.pintura = n.trabajo.pintura || {})[resto] = v
    else if (cual === '$:') n.precio[resto] = v
    else if (cual === 'o:') n.mo[resto] = v
    else if (cual === 'h:') n.hecho[resto] = v
    else if (cual === 'g:') n.gastos[resto] = v
    else if (cual === 'b:') n.notas[resto] = v
    else if (cual === 'c:') n.cfg[resto] = v
    else if (cual === 'r:') n.rubros[resto] = v
    else if (cual === 'v:') n.avances[resto] = v
    else if (cual === 't:') n.materiales[resto] = v
    else if (cual === 'd:') n.dudas[resto] = v
    else if (cual === 'k:') n.candidatos[resto] = v
    else if (cual === 'z:') {
      /* `z:c1r09` es el precio del rubro r09 según el candidato c1. Se parte
         por el id del candidato, que siempre es c + número, para que el resto
         sea el rubro entero por largo que sea. */
      const m = resto.match(/^(c\d+)(.+)$/)
      if (m) (n.cotiza[m[1]] = n.cotiza[m[1]] || {})[m[2]] = v
    }
  }
  n.abierto = S.abierto
  S = n
}

const guarda = () => {
  try {
    localStorage.setItem(LLAVE, JSON.stringify({
      h:T.h, ct:T.ct, cola:T.cola, clave:T.clave, abierto:S.abierto }))
  } catch (e) {}
}
try {
  const g = JSON.parse(localStorage.getItem(LLAVE) || 'null')
  if (g && g.h) {
    Object.assign(T.h, g.h); Object.assign(T.ct, g.ct || {})
    T.cola = g.cola || []; T.clave = g.clave || ''
    S.abierto = !!g.abierto
  } else if (g) {
    /* Lo que quedó guardado con el formato viejo, antes de los hechos: se
       convierte a hechos una sola vez para no perder lo ya escogido. */
    const mete = (k, v) => { if (v !== undefined && v !== null && v !== '') aplicar(k, v, 1) }
    /* Lo guardado con el formato viejo (antes de los hechos) se convierte una
       sola vez. Sus llaves eran el nombre entero; ahora se resume a ocho
       caracteres, así que hay que volver a calcularlas. */
    const corto = (q) => sha256(q).slice(0, 8)
    for (const q in (g.piso || {})) mete('p:' + corto(q), g.piso[q])
    for (const q in (g.nombre || {})) mete('m:' + corto(q), g.nombre[q])
    for (const q in (g.precio || {})) mete('$:' + q, g.precio[q])
    for (const q in (g.mo || {})) mete('o:' + q, g.mo[q])
    for (const q in (g.hecho || {})) mete('h:' + q, g.hecho[q])
    for (const w in (g.trabajo || {}))
      for (const q in g.trabajo[w]) mete((w === 'aplanado' ? 'a:' : 'q:') + corto(q), g.trabajo[w][q])
    if (g.merma !== undefined) mete('merma', g.merma)
    for (const k in T.h) T.cola.push({ k, v:T.h[k], t:1 })
  }
} catch (e) {}
desdeHechos()

const sync = { estado:'sin clave', ultimo:0, ocupado:false, reloj:null, alEstrenar:null }
function utf8(str){ return unescape(encodeURIComponent(str)); }
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const s=utf8(str), l=s.length, nb=((l+8)>>6)+1, w=new Array(nb*16).fill(0);
  for(let i=0;i<l;i++) w[i>>2]|=s.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8);
  w[nb*16-1]=l*8;
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let b=0;b<w.length;b+=16){
    const W=new Array(64);
    for(let t=0;t<16;t++) W[t]=w[b+t]|0;
    for(let t=16;t<64;t++){
      const s0=rotr(W[t-15],7)^rotr(W[t-15],18)^(W[t-15]>>>3);
      const s1=rotr(W[t-2],17)^rotr(W[t-2],19)^(W[t-2]>>>10);
      W[t]=(W[t-16]+s0+W[t-7]+s1)|0;
    }
    let [a,b2,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+W[t])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22), maj=(a&b2)^(a&c)^(b2&c);
      const t2=(S0+maj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b2; b2=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b2)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const normaliza = (c) => String(c || '').trim().toLowerCase()
const salaDe = (clave) => 'vp-' + sha256(normaliza(clave)).slice(0, 24)

function ponClave (clave) {
  T.clave = normaliza(clave)
  T.sala = T.clave ? salaDe(T.clave) : ''
  sync.estado = T.sala ? 'conectando' : 'sin clave'
  /* Al estrenar clave se sube todo lo que ya había en este teléfono. */
  if (T.sala) for (const k in T.h) T.cola.push({ k, v:T.h[k], t:T.ct[k] || 1 })
  if (T.sala && !S.hecho.laminado) sync.alEstrenar = estrenaLaminado
  guarda(); refrescaTodo(); if (T.sala) sincroniza()
}

async function sincroniza () {
  if (!T.sala || sync.ocupado) return false
  sync.ocupado = true
  let hubo = false
  try {
    const suben = T.cola.slice()
    const opciones = { method: suben.length ? 'POST' : 'GET',
      headers: { 'X-Torneo-Token': SYNC_TOKEN, 'Content-Type': 'application/json' } }
    if (suben.length) opciones.body = JSON.stringify({
      celdas: suben.map(({ k, v, t }) => ({ d:0, jid:k, h:0, v, t })) })
    const r = await fetch(`${SYNC_URL}/api/torneo/${encodeURIComponent(T.sala)}/scores`, opciones)
    if (!r.ok) throw new Error('http ' + r.status)
    const j = await r.json()
    const bajan = (j.celdas || []).map(c => ({ k:c.jid, v:c.v, t:c.t }))
    hubo = fusiona(bajan) > 0
    const eco = {}
    for (const c of bajan) eco[c.k] = Math.max(eco[c.k] || 0, c.t || 0)
    T.cola = T.cola.filter(c => !((eco[c.k] || 0) >= c.t))
    sync.estado = 'en vivo'; sync.ultimo = Date.now()
    if (hubo) desdeHechos()
    if (sync.alEstrenar) { const f = sync.alEstrenar; sync.alEstrenar = null; f() }
    guarda(); refrescaTodo()
  } catch (e) {
    sync.estado = 'sin señal'; pintaEstado()
  }
  sync.ocupado = false
  programarSync(T.cola.length ? 4000 : 20000)
  return hubo
}
function programarSync (ms) { clearTimeout(sync.reloj); sync.reloj = setTimeout(sincroniza, ms) }
addEventListener('visibilitychange', () => { if (document.hidden) sincroniza(); else programarSync(300) })

const espacios = DATOS.espacios
const porId = Object.fromEntries(espacios.map(e => [e.id, e]))
/* Lo que guardas se archiva por NOMBRE, no por número: el número depende del
   orden por tamaño y se recorre en cuanto se agrega o se parte un espacio,
   con lo que tus pisos se irían a parar a otro cuarto. El nombre que se usa
   es el de fábrica, no el que tú le pongas encima. */
/* El servidor CORTA la llave a 16 caracteres, así que no puede ir el nombre
   dentro: "piso.n1·Vestidor (paso)" y "piso.n1·Vestidor" llegaban como la
   misma llave y se pisaban entre teléfonos. Va un resumen corto del nombre,
   que es igual de estable y mide ocho. */
const llave = (e) => sha256(e.nivel + '·' + e.nombre).slice(0, 8)
const tipoDe = (e) => S.piso[llave(e)] || (e.piso === null ? 'nada' : null)
const nombreDe = (e) => S.nombre[llave(e)] || e.nombre
/* Tipos RETIRADOS: ya no se ofrecen al escoger piso, pero siguen existiendo
   para lo que quedó marcado antes. La alfombra salió del selector el 17-sep
   —de la casa se va entera, no es una opción de piso nuevo— y aun así el mapa
   tiene que saber pintarla y el Resumen contar sus metros mientras siga ahí. */
const TIPOS_RETIRADOS = [
  { id:'alfombra',    nombre:'Alfombra',       color:'#c9b7c6' },
]
const TIPOS_TODOS = TIPOS_BASE.concat(TIPOS_RETIRADOS)
const tipoPorId = Object.fromEntries(TIPOS_TODOS.map(t => [t.id, t]))
const SIN_TIPO = { nombre:'(tipo desconocido)', color:'#f0f0ee' }
const nMetros = (n) => n.toLocaleString('es-MX', { maximumFractionDigits:1 })
const nPesos  = (n) => '$' + Math.round(n).toLocaleString('es-MX')
/* Para tablas apretadas: 229,960 se vuelve 230 mil y no rompe la columna. */
const nMiles  = (n) => Math.abs(n) >= 10000
  ? Math.round(n/1000).toLocaleString('es-MX') + ' mil' : nPesos(n)
const muestraDe = (t) => t.css || t.color

/* ------------------------------------------------------------------
   16-sep-2026: lo que en el primer nivel es alfombra se va a cambiar por
   el laminado de roble. Se corre una sola vez y NUNCA pisa una elección
   hecha a mano: si ya había cuartos marcados como alfombra, se convierten
   ésos; si el teléfono venía en blanco, se siembran los cuartos que hoy
   traen alfombra en la casa (los baños no) para que se vea el preliminar.
   Lo que no sea así se corrige tocando el cuarto, como siempre.        */
const ALFOMBRADOS = ['Sala de TV', 'Recámara principal', 'Vestíbulo y escalera',
                     'Recámara 1', 'Recámara 2', 'Vestidor', 'Vestidor (paso)']
function estrenaLaminado () {
  if (S.hecho.laminado) return
  pon('h:laminado', true)
  if (!S.precio.laminado) pon('$:laminado', LAMINADO.precio)
  const n1 = espacios.filter(e => e.nivel === 'n1' && e.piso !== null)
  const marcados = n1.filter(e => S.piso[llave(e)] === 'alfombra')
  const destino = marcados.length ? marcados
                : n1.filter(e => !S.piso[llave(e)] && ALFOMBRADOS.includes(e.nombre))
  destino.forEach(e => pon('p:' + llave(e), 'laminado'))
  guarda()
}
/* Se siembra DESPUÉS de la primera bajada, no al abrir. Si no, un teléfono
   recién conectado marca laminado con sello de ahora y le gana a lo que el
   otro ya había escogido: así se perdió una duela en las pruebas. */
if (T.clave) sync.alEstrenar = estrenaLaminado
else estrenaLaminado()

/* ------------------------------------------------------------------
   El mapa. El fondo es el plano; `ids` es una imagen paralela donde el
   valor del píxel dice a qué espacio pertenece, así que tocar el plano
   y pintar un espacio son la misma operación: leer ese píxel.         */
const lienzo = document.getElementById('lienzo')
const ctx = lienzo.getContext('2d', { alpha:false })
const niveles = {}
let nivelActivo = 'pb'
const vista = { esc:1, dx:0, dy:0 }

function cargaNivel (tag) {
  const d = DATOS.niveles[tag]
  const n = { W:d.W, H:d.H, fondo:new Image(), listo:false, tinte:null, ids:null, madera:null }
  const ids = new Image()
  let faltan = 2
  const cuandoEste = () => { if (--faltan) return
    const c = document.createElement('canvas'); c.width = d.W; c.height = d.H
    const g = c.getContext('2d', { willReadFrequently:true })
    g.drawImage(ids, 0, 0)
    n.ids = g.getImageData(0, 0, d.W, d.H).data
    n.tinte = document.createElement('canvas'); n.tinte.width = d.W; n.tinte.height = d.H
    n.listo = true; pinta(); if (tag === nivelActivo) ajusta()
  }
  n.fondo.onload = cuandoEste; ids.onload = cuandoEste
  n.fondo.src = d.fondo; ids.src = d.ids
  niveles[tag] = n
}

/* Rellena el lienzo de tinte: cada píxel toma el color del piso de su
   espacio. Se rehace sólo cuando cambia una asignación, no al mover. */
function tinta (tag) {
  const n = niveles[tag]; if (!n || !n.listo) return
  const g = n.tinte.getContext('2d')
  const img = g.createImageData(n.W, n.H)
  const px = img.data, ids = n.ids
  const rgb = {}
  for (const e of espacios) {
    if (e.nivel !== tag) continue
    const t = tipoDe(e)
    const col = t ? (tipoPorId[t] || SIN_TIPO).color : '#ffffff'
    rgb[e.id] = [parseInt(col.slice(1,3),16), parseInt(col.slice(3,5),16), parseInt(col.slice(5,7),16)]
  }
  for (let i = 0, j = 0; i < ids.length; i += 4, j += 4) {
    const id = ids[i]
    const c = rgb[id]
    if (c) { px[j] = c[0]; px[j+1] = c[1]; px[j+2] = c[2] }
    else   { px[j] = 255;  px[j+1] = 255;  px[j+2] = 255 }
    px[j+3] = 255
  }
  g.putImageData(img, 0, 0)
  veta(tag)
}

/* ------------------------------------------------------------------
   Vista preliminar de los pisos de madera. El color plano dice qué piso
   lleva cada cuarto; esto dice cómo se va a ver: tablas de 19.3 × 138 cm
   dibujadas a la escala del plano y corriendo en la dirección de los muros
   largos (la casa está girada 28°). Es aproximado — el tono real depende de
   la luz — pero el tamaño de la tabla y las juntas sí son los del producto.
   Vale para el laminado y para el piso de ingeniería: cada uno con su tono
   y su serie de números, así que dos cuartos vecinos de distinto piso se
   distinguen.                                                           */
const K_MADERA = 2                 // se dibuja al doble, como el plano
const MADERAS = TIPOS_BASE.filter(t => t.tabla)
const semilla = (s) => () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296 }

function dibujaDuela (g, W, H, pxm, ang, mad) {
  const anc = mad.tabla[0]*pxm, largo = mad.tabla[1]*pxm
  const TONOS = mad.tonos
  const R = Math.hypot(W, H)
  const az = semilla(mad.azar)     // repetible: el piso no debe cambiar al repintar
  const pelo = Math.max(.6, anc*.06)
  g.save()
  g.translate(W/2, H/2); g.rotate(ang*Math.PI/180); g.translate(-R/2, -R/2)
  for (let fila = 0, y = 0; y < R; fila++, y += anc) {
    const corrido = (fila % 3)*largo/3 + az()*largo*.15   // juntas en tresbolillo
    for (let x = corrido - largo; x < R; x += largo) {
      g.fillStyle = TONOS[Math.floor(az()*TONOS.length)]
      g.fillRect(x, y, largo, anc)
      g.strokeStyle = 'rgba(122,84,48,.15)'; g.lineWidth = Math.max(.4, anc*.05)
      for (let v = 0; v < 3; v++) {          // la veta, para que no sea un rectángulo liso
        const vy = y + anc*(.22 + .28*v + az()*.1)
        g.beginPath(); g.moveTo(x + largo*az()*.15, vy)
        g.bezierCurveTo(x + largo*.35, vy + anc*.07*(az()-.5),
                        x + largo*.70, vy - anc*.07*(az()-.5),
                        x + largo*(.82 + az()*.18), vy)
        g.stroke()
      }
      g.fillStyle = 'rgba(96,70,44,.26)'; g.fillRect(x, y, pelo, anc)   // junta de cabeza
    }
    g.fillStyle = 'rgba(96,70,44,.22)'; g.fillRect(0, y, R, pelo)       // junta larga
  }
  g.restore()
}

/* Dibuja cada madera en TODO el nivel y luego la recorta con los píxeles de
   los espacios que la llevan: recortar sale más barato que dibujar cuarto
   por cuarto, y las tablas quedan corridas de un cuarto a otro, que es como
   se instala. Cada tipo de madera es una capa y todas caen en el mismo
   lienzo, en el orden de la lista de tipos. */
function mascara (n, cuales) {
  const m = document.createElement('canvas'); m.width = n.W; m.height = n.H
  const mg = m.getContext('2d')
  const img = mg.createImageData(n.W, n.H), px = img.data, ids = n.ids
  for (let i = 0, j = 0; i < ids.length; i += 4, j += 4) if (cuales.has(ids[i])) px[j+3] = 255
  mg.putImageData(img, 0, 0)
  return m
}

function veta (tag) {
  const n = niveles[tag]; if (!n || !n.listo) return
  const d = DATOS.niveles[tag]
  const capas = MADERAS
    .map(mad => [mad, new Set(espacios.filter(e => e.nivel === tag && tipoDe(e) === mad.id)
                                      .map(e => e.id))])
    .filter(([, cuales]) => cuales.size)
  if (!capas.length) { n.madera = null; return }
  const K = K_MADERA, W = n.W*K, H = n.H*K
  if (!n.madera) { n.madera = document.createElement('canvas'); n.madera.width = W; n.madera.height = H }
  const g = n.madera.getContext('2d')
  g.setTransform(1, 0, 0, 1, 0, 0)
  g.globalCompositeOperation = 'source-over'
  g.clearRect(0, 0, W, H)

  for (const [mad, cuales] of capas) {
    const c = document.createElement('canvas'); c.width = W; c.height = H
    const cg = c.getContext('2d')
    dibujaDuela(cg, W, H, d.pxm*K, d.ang, mad)
    cg.globalCompositeOperation = 'destination-in'
    cg.imageSmoothingEnabled = false     // el recorte va al filo del píxel del cuarto
    cg.drawImage(mascara(n, cuales), 0, 0, W, H)
    g.drawImage(c, 0, 0)
  }
}

function pinta () {
  const n = niveles[nivelActivo]
  const r = lienzo.getBoundingClientRect()
  const dpr = Math.min(devicePixelRatio || 1, 2)
  if (lienzo.width !== Math.round(r.width*dpr) || lienzo.height !== Math.round(r.height*dpr)) {
    lienzo.width = Math.round(r.width*dpr); lienzo.height = Math.round(r.height*dpr)
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.fillStyle = '#f6f6f4'; ctx.fillRect(0, 0, r.width, r.height)
  if (!n || !n.listo) return
  ctx.save()
  ctx.translate(vista.dx, vista.dy); ctx.scale(vista.esc, vista.esc)
  ctx.imageSmoothingEnabled = true
  ctx.drawImage(n.tinte, 0, 0)
  if (n.madera) ctx.drawImage(n.madera, 0, 0, n.W, n.H)   // la duela, ya recortada
  ctx.globalCompositeOperation = 'multiply'
  ctx.drawImage(n.fondo, 0, 0, n.W, n.H)   // el dibujo viene al doble, se acomoda aquí
  ctx.globalCompositeOperation = 'source-over'
  ctx.restore()

  /* Las etiquetas van en pantalla, no en el plano: así no crecen ni encogen
     con el acercamiento. Cada una se mide contra lo que ocupa su cuarto en
     pantalla y se calla antes de desbordarse de sus muros. */
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'
  const NOMBRE = '600 11.5px -apple-system,system-ui,sans-serif'
  const METROS = '500 10px -apple-system,system-ui,sans-serif'
  const escribe = (txt, x, y, fuente, color) => {
    ctx.font = fuente
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.9)'
    ctx.strokeText(txt, x, y)
    ctx.fillStyle = color; ctx.fillText(txt, x, y)
  }
  for (const e of espacios) {
    if (e.nivel !== nivelActivo) continue
    const x = e.cx*vista.esc + vista.dx, y = e.cy*vista.esc + vista.dy
    if (x < -60 || y < -30 || x > r.width+60 || y > r.height+30) continue
    const anchoCuarto = (e.ancho || 40)*vista.esc, altoCuarto = (e.altoCaja || 40)*vista.esc
    if (altoCuarto < 15 || anchoCuarto < 28) continue
    const t = tipoDe(e), puesto = t && t !== 'nada'
    const nom = nombreDe(e), metros = nMetros(e.m2) + ' m²'
    ctx.font = NOMBRE
    const cabeNombre = altoCuarto > 30 && ctx.measureText(nom).width < anchoCuarto - 10
    if (cabeNombre) {
      escribe(nom, x, y-7, NOMBRE, puesto ? '#252a31' : '#9aa0a8')
      escribe(metros, x, y+7, METROS, puesto ? '#6a7079' : '#aab0b8')
    } else {
      escribe(metros, x, y, METROS, puesto ? '#252a31' : '#9aa0a8')
    }
  }
}

function ajusta () {
  const n = niveles[nivelActivo]; if (!n || !n.listo) return
  const r = lienzo.getBoundingClientRect()
  /* En un teléfono, meter el plano entero deja los cuartos del tamaño de
     una uña: ahí conviene llenar la altura y navegar de lado. En una
     pantalla ancha sí cabe completo. */
  const cabe = Math.min(r.width/n.W, r.height/n.H)
  const llena = Math.max(r.width/n.W, r.height/n.H)
  vista.esc = (r.width/r.height < n.W/n.H ? Math.min(llena, cabe*3) : cabe) * .97
  vista.dx = (r.width  - n.W*vista.esc)/2
  vista.dy = (r.height - n.H*vista.esc)/2
  pinta()
}

function espacioEn (cx, cy) {
  const n = niveles[nivelActivo]; if (!n || !n.listo) return null
  const x = Math.round((cx - vista.dx)/vista.esc), y = Math.round((cy - vista.dy)/vista.esc)
  if (x < 0 || y < 0 || x >= n.W || y >= n.H) return null
  const id = n.ids[(y*n.W + x)*4]
  return id ? porId[id] : null
}

/* ---- gestos: arrastrar, pellizcar, rueda ---- */
let toques = new Map(), arrastro = null, movido = 0
lienzo.addEventListener('pointerdown', ev => {
  lienzo.setPointerCapture(ev.pointerId)
  toques.set(ev.pointerId, { x:ev.clientX, y:ev.clientY })
  if (toques.size === 1) { arrastro = { x:ev.clientX, y:ev.clientY }; movido = 0 }
})
lienzo.addEventListener('pointermove', ev => {
  if (!toques.has(ev.pointerId)) return
  const antes = toques.get(ev.pointerId)
  toques.set(ev.pointerId, { x:ev.clientX, y:ev.clientY })
  if (toques.size === 1 && arrastro) {
    const dx = ev.clientX - antes.x, dy = ev.clientY - antes.y
    vista.dx += dx; vista.dy += dy; movido += Math.abs(dx) + Math.abs(dy); pinta()
  } else if (toques.size === 2) {
    const [a, b] = [...toques.values()]
    if (lienzo._d) {
      const d = Math.hypot(a.x-b.x, a.y-b.y)
      const r = lienzo.getBoundingClientRect()
      const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top
      acerca(d/lienzo._d, mx, my)
    }
    lienzo._d = Math.hypot(a.x-b.x, a.y-b.y)
    movido += 99
  }
})
function suelta (ev) {
  const era = toques.size
  toques.delete(ev.pointerId)
  if (toques.size < 2) lienzo._d = null
  if (era === 1 && movido < 8) {
    const r = lienzo.getBoundingClientRect()
    const e = espacioEn(ev.clientX - r.left, ev.clientY - r.top)
    if (e) abreFicha(e)
  }
  if (!toques.size) arrastro = null
}
lienzo.addEventListener('pointerup', suelta)
lienzo.addEventListener('pointercancel', suelta)
lienzo.addEventListener('wheel', ev => {
  ev.preventDefault()
  const r = lienzo.getBoundingClientRect()
  acerca(Math.exp(-ev.deltaY*0.0016), ev.clientX-r.left, ev.clientY-r.top)
}, { passive:false })
function acerca (f, mx, my) {
  const nueva = Math.max(.2, Math.min(6, vista.esc*f))
  f = nueva/vista.esc
  vista.dx = mx - (mx - vista.dx)*f
  vista.dy = my - (my - vista.dy)*f
  vista.esc = nueva; pinta()
}
document.getElementById('acercar').onclick = () => { const r = lienzo.getBoundingClientRect(); acerca(1.3, r.width/2, r.height/2) }
document.getElementById('menos').onclick = () => { const r = lienzo.getBoundingClientRect(); acerca(1/1.3, r.width/2, r.height/2) }
document.getElementById('ajustar').onclick = ajusta
addEventListener('resize', () => { ajusta() })

/* ------------------------------------------------------------------
   Ficha del espacio                                                  */
