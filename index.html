/* ------------------------------------------------------------------
   Resumen: cuántos m² de cada piso y, si pusiste precio, cuánto cuesta */
/* Aplanado y pintura. La superficie no es la del piso: es el perímetro del
   espacio por su altura, menos lo que se llevan puertas y ventanas, más el
   plafón. Sale del mismo modelo que el 3D. Por omisión lo llevan los espacios
   techados; la terraza, los jardines y los vacíos no. */
const TRABAJOS = [
  { id:'aplanado', nombre:'Aplanado de muros y plafón' },
  { id:'pintura',  nombre:'Pintura' },
]
const lleva = (idt, e) => {
  const v = (S.trabajo[idt] || {})[llave(e)]
  return v === undefined ? !!e.techado : !!v
}
function superficie (idt) {
  let muros = 0, techo = 0, dentro = [], fuera = []
  for (const e of espacios) {
    if (lleva(idt, e)) { muros += e.muros || 0; techo += e.techo || 0; dentro.push(nombreDe(e)) }
    else if (e.techado) fuera.push(nombreDe(e))
  }
  return { muros, techo, m2: muros + techo, dentro, fuera }
}

function porTipo () {
  const r = {}
  for (const e of espacios) {
    const t = tipoDe(e); if (!t || t === 'nada') continue
    ;(r[t] = r[t] || { m2:0, n:0, espacios:[] })
    r[t].m2 += e.m2; r[t].n++; r[t].espacios.push(nombreDe(e))
  }
  return r
}
/* La ficha del laminado: lo que dice la etiqueta de la tienda, más lo que
   sale de tus metros (cajas y costo). Si todavía queda alfombra marcada,
   ofrece cambiarla de un jalón. */
function fichaLaminado (r, merma) {
  const d = r.laminado
  const quedan = espacios.filter(e => tipoDe(e) === 'alfombra')
  if (!d && !quedan.length) return ''
  const p = +S.precio.laminado || 0
  const filas = [
    ['Modelo',   `${LAMINADO.modelo} · código ${LAMINADO.codigo}`],
    ['Tabla',    `${LAMINADO.tabla[0]*100} × ${LAMINADO.tabla[1]*100} cm · ${LAMINADO.espesor}`],
    ['Caja',     `${LAMINADO.caja} m² · ${LAMINADO.union} · ${LAMINADO.borde}`],
    ['Precio',   `${nPesos(LAMINADO.precio)} /m² <span class="nada">(antes ${nPesos(LAMINADO.antes)})</span>`],
    ['Origen',   `${LAMINADO.origen} · garantía ${LAMINADO.garantia}`],
  ]
  const cuenta = d
    ? `<p class="guia"><b>${nMetros(d.m2)} m²</b> en ${d.n} espacios · ${nMetros(d.m2*merma)} m² con merma ·
         <b>${Math.ceil(d.m2*merma/LAMINADO.caja)} cajas</b>${p ? ` · ${nPesos(d.m2*merma*p)}` : ''}</p>`
    : ''
  return `<div class="tarjeta">
      <h2>Laminado roble</h2>
      <div class="tira" style="background:${LAMINADO.css}"></div>
      <table>${filas.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
      ${cuenta}
      <p class="guia">La vista del mapa es aproximada: la tabla va a su medida real y
        corriendo como los muros, pero el tono depende de la luz de cada cuarto.</p>
      ${quedan.length ? `<button class="btn" id="cambia-alfombra">Cambiar a laminado la alfombra
         que queda (${quedan.map(nombreDe).join(', ')})</button>` : ''}
    </div>`
}

/* La lista para escoger espacio por espacio. Va aquí y no sólo en la ficha
   porque son 27: marcarlos de uno en uno abriendo cada ficha es un suplicio. */
function escogerEspacios () {
  const fila = (e) => `<tr>
      <td>${nombreDe(e)} <span class="nada">${e.nivel === 'pb' ? 'PB' : 'N1'}</span></td>
      <td>${nMetros((e.muros || 0) + (e.techo || 0))}</td>
      ${TRABAJOS.map(w => `<td><button class="marca" data-marca="${w.id}" data-esp="${e.id}"
          aria-pressed="${lleva(w.id, e)}">${lleva(w.id, e) ? '✓' : ''}</button></td>`).join('')}
    </tr>`
  const cuantos = espacios.filter(e => lleva('aplanado', e) || lleva('pintura', e)).length
  return `<details class="escoger" ${S.abierto ? 'open' : ''}>
      <summary>Escoger espacios · ${cuantos} de ${espacios.length}</summary>
      <table>
        <tr><th>Espacio</th><th>m²</th><th>Apl.</th><th>Pint.</th></tr>
        ${espacios.map(fila).join('')}
      </table>
    </details>`
}

function tarjetaObra () {
  let mat = 0, ob = 0, hay = false
  const filas = TRABAJOS.map(w => {
    const s = superficie(w.id)
    if (!s.m2) return ''
    const p = +S.precio[w.id] || 0, m = +S.mo[w.id] || 0
    const cMat = s.m2*p, cObra = s.m2*m
    mat += cMat; ob += cObra; if (p || m) hay = true
    return `<tr>
      <td>${w.nombre}</td>
      <td>${nMetros(s.m2)}</td>
      <td><input class="precio" inputmode="numeric" data-precio="${w.id}"
                 value="${S.precio[w.id] || ''}" placeholder="—"></td>
      <td><input class="precio" inputmode="numeric" data-mo="${w.id}"
                 value="${S.mo[w.id] || ''}" placeholder="—"></td>
      <td>${(p || m) ? nPesos(cMat + cObra) : '<span class="nada">—</span>'}</td></tr>
      <tr class="detalle"><td colspan="5">${nMetros(s.muros)} m² de muro y
        ${nMetros(s.techo)} m² de plafón${s.fuera.length
          ? ` · fuera: ${s.fuera.join(' · ')}` : ''}</td></tr>`
  }).join('')
  if (!filas) return ''
  return `<div class="tarjeta">
      <h2>Aplanado y pintura</h2>
      <table>
        <tr><th>Trabajo</th><th>m²</th><th>Material<br>$/m²</th>
            <th>Obra<br>$/m²</th><th>Costo</th></tr>
        ${filas}
        <tr class="total"><td>Total</td><td></td><td></td><td></td>
            <td>${hay ? nPesos(mat + ob) : '<span class="nada">—</span>'}</td></tr>
      </table>
      ${hay ? `<p class="guia">Material ${nPesos(mat)} · mano de obra ${nPesos(ob)}.</p>` : ''}
      <p class="guia">La superficie es perímetro por altura menos puertas y
      ventanas, más el plafón. Aquí no se cuenta merma: la pintura y el yeso se
      compran por bote y por saco, no por metro cortado.</p>
      ${escogerEspacios()}
    </div>`
}

function dibujaResumen () {
  const r = porTipo()
  const merma = 1 + (+S.merma||0)/100
  const sinDefinir = espacios.filter(e => !tipoDe(e))
  /* El material se paga con merma —lo roto y lo cortado también se compra— y
     la mano de obra no: al instalador se le paga el metro puesto. */
  let material = 0, obra = 0, conPrecio = false
  const filas = TIPOS_TODOS.filter(t => r[t.id]).map(t => {
    const d = r[t.id], p = +S.precio[t.id] || 0, m = +S.mo[t.id] || 0
    const cMat = d.m2*merma*p, cObra = d.m2*m
    material += cMat; obra += cObra; if (p || m) conPrecio = true
    const cajas = t.caja ? ` · ${Math.ceil(d.m2*merma/t.caja)} cajas de ${t.caja} m²` : ''
    return `<tr>
      <td><span class="muestra" style="background:${muestraDe(t)}"></span>${t.nombre}</td>
      <td>${nMetros(d.m2)}</td>
      <td>${nMetros(d.m2*merma)}</td>
      <td><input class="precio" inputmode="numeric" data-precio="${t.id}"
                 value="${S.precio[t.id] || ''}" placeholder="—"></td>
      <td><input class="precio" inputmode="numeric" data-mo="${t.id}"
                 value="${S.mo[t.id] || ''}" placeholder="—"></td>
      <td>${(p || m) ? nPesos(cMat + cObra) : '<span class="nada">—</span>'}</td></tr>
      <tr class="detalle"><td colspan="6">${d.espacios.join(' · ')}${cajas}</td></tr>`
  }).join('')
  const costo = material + obra
  const total = Object.values(r).reduce((a, d) => a + d.m2, 0)

  document.getElementById('resumen').innerHTML = `
    <div class="tarjeta">
      <h2>Piso por comprar</h2>
      ${filas ? `<table>
        <tr><th>Tipo</th><th>m²</th><th>+merma</th><th>Material<br>$/m²</th>
            <th>Obra<br>$/m²</th><th>Costo</th></tr>
        ${filas}
        <tr class="total"><td>Total</td><td>${nMetros(total)}</td>
            <td>${nMetros(total*merma)}</td><td></td><td></td>
            <td>${conPrecio ? nPesos(costo) : '<span class="nada">—</span>'}</td></tr>
      </table>
      ${conPrecio ? `<p class="guia">Material ${nPesos(material)} · mano de obra ${nPesos(obra)}.
         El material se cuenta con merma y la mano de obra sin ella: lo que se
         rompe se compra, pero no se instala.</p>` : ''}`
      : '<p class="guia">Todavía no le has puesto piso a ningún espacio.</p>'}
      <p class="guia fila-merma">Merma
        <input class="precio fila-merma" id="merma" inputmode="numeric" value="${S.merma}"> %
        &nbsp;— lo que se rompe y se corta.</p>
    </div>

    ${tarjetaObra()}

    ${fichaLaminado(r, merma)}

    <div class="tarjeta">
      <h2>Sin definir · ${sinDefinir.length}</h2>
      ${sinDefinir.length
        ? `<table>${sinDefinir.map(e => `<tr><td>${nombreDe(e)}</td>
             <td class="nada">${e.nivel === 'pb' ? 'Planta baja' : 'Primer nivel'}</td>
             <td>${nMetros(e.m2)} m²</td></tr>`).join('')}</table>`
        : '<p class="guia">Ninguno: todos los espacios tienen piso.</p>'}
    </div>

    <div class="tarjeta">
      <h2>De dónde salen los metros</h2>
      <p class="guia">Medidos sobre tus planos a escala 1:50. Es área de piso terminado,
      de muro interior a muro interior. Contra el contrato viejo: terraza 20.5 m² (ahí decía 22).</p>
    </div>

    <button class="btn fuerte" id="copiar">Copiar el resumen</button>`

  document.getElementById('merma').oninput = ev => {
    pon('merma', Math.max(0, Math.min(40, +ev.target.value || 0)))
    const s = ev.target.selectionStart; dibujaResumen()
    const m = document.getElementById('merma'); m.focus(); m.setSelectionRange(s, s)
  }
  const caja = document.querySelector('.escoger')
  if (caja) caja.ontoggle = () => { S.abierto = caja.open; guarda() }
  document.getElementById('resumen').querySelectorAll('[data-marca]').forEach(b => {
    b.onclick = () => {
      const idt = b.dataset.marca, e = porId[+b.dataset.esp]
      pon((idt === 'aplanado' ? 'a:' : 'q:') + llave(e), !lleva(idt, e))
      dibujaResumen()
    }
  })
  for (const [atributo, donde] of [['data-precio', 'precio'], ['data-mo', 'mo']]) {
    document.getElementById('resumen').querySelectorAll(`[${atributo}]`).forEach(inp => {
      inp.oninput = ev => {
        const cual = ev.target.getAttribute(atributo)
        pon((donde === 'precio' ? '$:' : 'o:') + cual, +ev.target.value || 0)
        const s = ev.target.selectionStart
        dibujaResumen()
        const v = document.querySelector(`[${atributo}="${cual}"]`)
        v.focus(); v.setSelectionRange(s, s)
      }
    })
  }
  const cambia = document.getElementById('cambia-alfombra')
  if (cambia) cambia.onclick = () => {
    const tocados = new Set()
    for (const e of espacios) if (tipoDe(e) === 'alfombra') { pon('p:' + llave(e), 'laminado'); tocados.add(e.nivel) }
    guarda(); tocados.forEach(tag => tinta(tag)); pinta(); dibujaResumen()
  }
  document.getElementById('copiar').onclick = () => {
    const l = ['Villa Popolo · pisos', '']
    for (const t of TIPOS_BASE) { if (!r[t.id]) continue
      const p = +S.precio[t.id] || 0, m = +S.mo[t.id] || 0
      l.push(`${t.nombre}: ${nMetros(r[t.id].m2)} m² (${nMetros(r[t.id].m2*merma)} con merma)`
             + (t.caja ? ` · ${Math.ceil(r[t.id].m2*merma/t.caja)} cajas` : '')
             + (p ? ` · material ${nPesos(r[t.id].m2*merma*p)}` : '')
             + (m ? ` · mano de obra ${nPesos(r[t.id].m2*m)}` : ''))
      l.push(`   ${r[t.id].espacios.join(', ')}`)
    }
    l.push('', `Total: ${nMetros(total)} m² · ${nMetros(total*merma)} m² con ${S.merma}% de merma`)
    if (material || obra) l.push(`Material ${nPesos(material)} · mano de obra ${nPesos(obra)} · total ${nPesos(costo)}`)
    if (sinDefinir.length) l.push(`Faltan por definir: ${sinDefinir.map(nombreDe).join(', ')}`)
    navigator.clipboard.writeText(l.join('\n')).then(() => {
      const b = document.getElementById('copiar'); b.textContent = 'Copiado'
      setTimeout(() => { b.textContent = 'Copiar el resumen' }, 1400)
    })
  }
}

/* ------------------------------------------------------------------
   Gastos. Lo que de verdad se ha desembolsado, frente a lo que el plano
   dice que cuesta. Viene de la app de obra: compras de material (con su
   ticket) y pagos de mano de obra, cada uno con quién puso el dinero.   */
const nDia = (iso) => {
  const d = String(iso || '').split('-')
  return d.length === 3 ? `${+d[2]} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+d[1]-1]}` : ''
}
const pagadores = () => S.cfg.pagadores || ['Denise', 'Dorila']
const hoyISO = () => new Date().toISOString().slice(0, 10)
const nuevoId = (pre) => pre + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36).padStart(2,'0')

/* El gasto que se está corrigiendo; null cuando el formulario es para uno nuevo. */
let editando = null
const CAMPOS_GASTO = ['g-tipo', 'g-fecha', 'g-concepto', 'g-monto', 'g-quien', 'g-prov']
/* Un concepto con comillas —cemento «gris»— rompería el value="" del campo. */
const atr = (t) => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

function dibujaGastos () {
  const cont = document.getElementById('gastos')
  /* La lista y el formulario viven en nodos APARTE, y no es cosmético:
     `sincroniza()` redibuja la pestaña activa cada 20 segundos (cada 4 si hay
     cola por subir), y mientras el formulario estuvo adentro cada sincronizada
     se llevaba lo que ibas tecleando. Ahora sólo se rehace la lista. */
  if (!cont.querySelector('#g-lista'))
    cont.innerHTML = '<div id="g-lista"></div><div id="g-forma"></div>'
  /* Si el otro teléfono borró el gasto que tenías abierto, ya no hay qué editar. */
  if (editando && !S.gastos[editando]) editando = null

  const lista = Object.entries(S.gastos).map(([id, g]) => ({ id, ...g }))
    .filter(g => g && !g.borrado).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))
  const suma = (f) => lista.filter(f).reduce((a, g) => a + (+g.monto || 0), 0)
  const materiales = suma(g => g.tipo === 'compra'), obra = suma(g => g.tipo === 'pago')
  const porQuien = {}
  for (const g of lista) porQuien[g.quien || 'Sin asignar'] = (porQuien[g.quien || 'Sin asignar'] || 0) + (+g.monto || 0)
  const sinAsignar = lista.filter(g => !g.quien).length

  cont.querySelector('#g-lista').innerHTML = `
    <div class="tarjeta">
      <h2>Lo que va gastado</h2>
      <table>
        <tr><td>Material</td><td>${nPesos(materiales)}</td></tr>
        <tr><td>Mano de obra</td><td>${nPesos(obra)}</td></tr>
        <tr class="total"><td>Total</td><td>${nPesos(materiales + obra)}</td></tr>
      </table>
      ${sinAsignar ? `<p class="guia">${sinAsignar} gasto${sinAsignar > 1 ? 's' : ''} sin decir quién lo puso.</p>` : ''}
    </div>

    <div class="tarjeta">
      <h2>Quién ha desembolsado</h2>
      ${Object.keys(porQuien).length
        ? `<table>${Object.entries(porQuien).sort((a,b)=>b[1]-a[1]).map(([q, v]) =>
            `<tr><td>${q}</td><td>${nPesos(v)}</td></tr>`).join('')}</table>`
        : '<p class="guia">Todavía no hay gastos capturados.</p>'}
    </div>

    <div class="tarjeta">
      <h2>Movimientos · ${lista.length}</h2>
      ${lista.length ? '<p class="guia" style="margin:0 0 6px">Toca un movimiento para corregirlo.</p>' : ''}
      ${lista.map(g => `<div class="gasto${g.id === editando ? ' editando' : ''}"
             data-editar="${g.id}" role="button" tabindex="0">
          <span class="dia">${nDia(g.fecha)}</span>
          <span class="qué">${g.concepto || ''}<br>
            <span class="quien">${g.tipo === 'pago' ? 'Mano de obra' : 'Material'}${
              g.proveedor ? ' · ' + g.proveedor : ''} ·
              <select class="quienSel${g.quien ? '' : ' pendiente'}" data-quien="${g.id}">
                <option value="">¿quién puso?</option>${
                  /* si el que pagó ya no está en la lista de Ajustes, igual se
                     conserva: si no, al tocar cualquier otro se perdería */
                  [...new Set([...pagadores(), ...(g.quien ? [g.quien] : [])])].map(q =>
                    `<option${q === g.quien ? ' selected' : ''}>${q}</option>`).join('')}
              </select></span></span>
          <span class="monto">${nPesos(g.monto)}</span>
        </div>`).join('') || '<p class="guia">Nada todavía. Agrega el primero abajo.</p>'}
    </div>`

  /* Corregir quién puso el dinero sin volver a capturar el gasto: los cuatro
     que vinieron de la app de obra llegaron sin dueño. */
  cont.querySelectorAll('[data-quien]').forEach(sel => {
    sel.onchange = () => {
      const id = sel.dataset.quien
      pon('g:' + id, { ...S.gastos[id], quien: sel.value })
      dibujaGastos()
    }
  })

  /* Tocar el movimiento lo abre abajo para corregirlo. El menú de quién puso
     es suyo y no cuenta como tocar el renglón. */
  cont.querySelector('#g-lista').onclick = ev => {
    if (ev.target.closest('[data-quien]')) return
    const fila = ev.target.closest('[data-editar]'); if (!fila) return
    editando = fila.dataset.editar
    dibujaGastos()
    const f = document.getElementById('g-forma')
    if (f.scrollIntoView) f.scrollIntoView({ behavior:'smooth', block:'nearest' })
  }

  /* El formulario se rehace SÓLO cuando hace falta: si no hay ninguno, si
     cambió el gasto al que apunta, o si cambió la lista de quién puede pagar
     —y eso último conservando lo tecleado—. */
  const forma = cont.querySelector('#g-forma')
  if (!forma.firstElementChild || forma.dataset.gasto !== (editando || '')) dibujaForma()
  else if (forma.dataset.pagadores !== pagadores().join('·')) dibujaForma(true)
}

function dibujaForma (conserva) {
  const forma = document.getElementById('g-forma')
  const llevaba = conserva
    ? Object.fromEntries(CAMPOS_GASTO.map(id => [id, (document.getElementById(id) || {}).value || ''])) : null
  const g = editando ? S.gastos[editando] : null
  const quienes = [...new Set([...pagadores(), ...(g && g.quien ? [g.quien] : [])])]
  forma.dataset.gasto = editando || ''
  forma.dataset.pagadores = pagadores().join('·')
  forma.innerHTML = `
    <div class="tarjeta">
      <h2>${g ? 'Editar gasto' : 'Agregar gasto'}</h2>
      <div class="dosCampos">
        <label class="campo">Qué es
          <select id="g-tipo">
            <option value="compra"${g && g.tipo === 'compra' ? ' selected' : ''}>Material</option>
            <option value="pago"${g && g.tipo === 'pago' ? ' selected' : ''}>Mano de obra</option></select></label>
        <label class="campo">Cuándo <input id="g-fecha" type="date" value="${atr((g && g.fecha) || hoyISO())}"></label>
      </div>
      <label class="campo">Concepto
        <input id="g-concepto" placeholder="Cemento, 50 bultos" value="${atr(g && g.concepto)}"></label>
      <div class="dosCampos">
        <label class="campo">Monto
          <input id="g-monto" inputmode="numeric" placeholder="0" value="${g && g.monto ? atr(g.monto) : ''}"></label>
        <label class="campo">Quién lo puso
          <select id="g-quien"><option value="">—</option>${
            quienes.map(q => `<option${g && q === g.quien ? ' selected' : ''}>${q}</option>`).join('')}</select></label>
      </div>
      <label class="campo">Proveedor
        <input id="g-prov" placeholder="opcional" value="${atr(g && g.proveedor)}"></label>
      <button class="btn fuerte" id="g-guardar" style="margin-top:12px">${
        g ? 'Guardar los cambios' : 'Guardar el gasto'}</button>
      ${g ? `<button class="btn" id="g-cancelar" style="margin-top:8px">Cancelar</button>
             <button class="btn malo" id="g-borrar" style="margin-top:8px">Borrar el gasto</button>` : ''}`
    + '</div>'
  if (llevaba) for (const id in llevaba) {
    const n = document.getElementById(id); if (n && llevaba[id]) n.value = llevaba[id]
  }

  document.getElementById('g-guardar').onclick = () => {
    const monto = +document.getElementById('g-monto').value || 0
    const concepto = document.getElementById('g-concepto').value.trim()
    if (!monto || !concepto) { alert('Falta el concepto o el monto.'); return }
    /* Al corregir se escribe la MISMA llave: el hecho se pisa con sello nuevo
       y en el teléfono de Denise el gasto se corrige en vez de duplicarse.
       Lo de antes se conserva por si trae campos que el formulario no enseña
       (la nota del ticket, por ejemplo). */
    const id = editando || nuevoId('g')
    pon('g:' + id, { ...(S.gastos[id] || {}),
      tipo: document.getElementById('g-tipo').value,
      fecha: document.getElementById('g-fecha').value || hoyISO(),
      concepto, monto,
      quien: document.getElementById('g-quien').value,
      proveedor: document.getElementById('g-prov').value.trim(),
    })
    editando = null; dibujaForma(); dibujaGastos()
  }

  const cancelar = document.getElementById('g-cancelar')
  if (cancelar) cancelar.onclick = () => { editando = null; dibujaForma(); dibujaGastos() }

  const borrar = document.getElementById('g-borrar')
  if (borrar) borrar.onclick = () => {
    const viejo = S.gastos[editando]; if (!viejo) return
    if (!confirm(`¿Borrar «${viejo.concepto || 'este gasto'}» de ${nPesos(viejo.monto)}?`)) return
    /* Lápida, no borrón: así el otro teléfono también lo da de baja. */
    pon('g:' + editando, { ...viejo, borrado: true })
    editando = null; dibujaForma(); dibujaGastos()
  }
}

/* ------------------------------------------------------------------
   Más: lo que viene de la app de obra y no cabe en una pestaña propia.
   El alcance (lo que hay que hacer), los materiales estimados y las dudas
   que quedaron abiertas de la cotización vieja.                        */
let subMas = 'menu'
const MENU = [['alcance','Alcance de la obra'],['candidatos','Candidatos y cotizaciones'],
              ['materiales','Materiales estimados'],
              ['pendientes','Dudas por aclarar'],['ajustes','Ajustes']]

function dibujaMas () {
  const n = document.getElementById('mas')
  if (subMas === 'menu') {
    const dudas = Object.values(S.dudas || {}).filter(d => d && d.estatus === 'abierto').length
    n.innerHTML = `<div class="tarjeta menu">${MENU.map(([id, nom]) =>
      `<a href="#" data-sub="${id}">${nom}${id === 'pendientes' && dudas ? ` <b>· ${dudas}</b>` : ''} <span>›</span></a>`).join('')}</div>`
    n.querySelectorAll('[data-sub]').forEach(a => a.onclick = (ev) => {
      ev.preventDefault(); subMas = a.dataset.sub; dibujaMas()
    })
    return
  }
  /* La ficha del candidato trae su propia liga de regreso; sin esto salen las
     dos pegadas («‹ Más‹ Candidatos»). */
  const atras = (subMas === 'candidatos' && candActivo) ? ''
    : `<a href="#" id="atras" class="atras">‹ Más</a>`
  n.innerHTML = atras + ({ alcance:vistaAlcance, candidatos:vistaCandidatos,
                           materiales:vistaMateriales,
                           pendientes:vistaDudas, ajustes:vistaAjustes }[subMas])()
  const volver = document.getElementById('atras')
  if (volver) volver.onclick = (ev) => { ev.preventDefault(); subMas = 'menu'; dibujaMas() }
  if (subMas === 'ajustes') enganchaAjustes()
  if (subMas === 'candidatos') enganchaCandidatos()
  if (subMas === 'pendientes') n.querySelectorAll('[data-duda]').forEach(b => b.onclick = () => {
    const id = b.dataset.duda, d = S.dudas[id]
    pon('d:' + id, { ...d, estatus: d.estatus === 'abierto' ? 'cerrado' : 'abierto' })
    dibujaMas()
  })
}

/* ------------------------------------------------------------------
   El estimado de obra: todo lo que se sabe, sumado en un renglón.

   Nadie ha cotizado la casa todavía, así que esto NO es un presupuesto: es
   el alcance a precios de la cotización vieja, más lo que el mapa ya sabe
   del piso, más el material que compras tú. Cada renglón dice de dónde sale
   y los supuestos van marcados como tales.                              */

/* Nadie ha cotizado poner el laminado. A falta de número, el de mercado. */
const INSTALA_LAMINADO = 100          // $/m², supuesto

function estimado (cid) {
  const merma = 1 + (+S.merma || 0) / 100
  const r = porTipo()
  const rubros = rubrosPorN()
  const quien = candidatos().find(c => c.id === (cid || 'guz')) || { ref:true, mat:true, precios:{} }

  /* 1. Los rubros, a los precios de quien sea, con las cantidades que esté
        usando la app (contrato o plano). Sin decir de quién, los de Guzmán. */
  const suyo = (x) => quien.ref ? (+x.matU || 0) + (+x.moU || 0) : (+quien.precios[x.id] || 0)
  const alcance = rubros.reduce((a, x) => a + cantidadRubro(x) * suyo(x), 0)

  /* 2. El que cotiza sólo mano de obra queda corto contra el que incluye
        material: para poder compararlos se le presta el material de Guzmán,
        y sólo de los rubros que él sí cotizó. Es referencia, no su precio. */
  const soloObra = !quien.ref && quien.mat === false
  const matRef = !soloObra ? 0 : rubros.reduce((a, x) =>
    a + (suyo(x) ? cantidadRubro(x) * (+x.matU || 0) : 0), 0)

  /* 2. El piso que escogiste en el mapa: material con merma, al precio que le
        pusiste. Hoy sólo el laminado trae precio de tienda. */
  let pisoMat = 0
  for (const t of TIPOS_BASE) if (r[t.id]) pisoMat += r[t.id].m2 * merma * (+S.precio[t.id] || 0)

  /* 3. Ponerlo. Si le pusiste mano de obra en el Resumen, se usa la tuya. */
  const lam = r.laminado ? r.laminado.m2 : 0
  const instala = lam * (+S.mo.laminado || INSTALA_LAMINADO)
  const suponeInstala = !+S.mo.laminado && lam > 0

  /* 4. El piso duro de adentro que el contrato no alcanzaba a cubrir: él
        cotizó 140 m² y el mapa dice cuánto hay de verdad. */
  const duro = ['porcelanato', 'loseta', 'marmol']
  const r7 = rubros.find(x => x.n === 7)
  let m2duro = 0
  for (const e of espacios) if (e.techado && duro.includes(tipoDe(e))) m2duro += e.m2
  const faltanM2 = r7 ? Math.max(0, m2duro - (+r7.cant || 0)) : 0
  const pisoFalta = faltanM2 * (r7 ? (+r7.matU || 0) + (+r7.moU || 0) : 0)

  /* 5. Lo que compras tú, y lo que ya compraste. */
  const materiales = Object.values(S.materiales || {})
    .reduce((a, m) => a + (+m.cant || 0) * (+m.puEst || 0), 0)
  const comprado = Object.values(S.gastos || {})
    .filter(g => g && g.tipo === 'compra').reduce((a, g) => a + (+g.monto || 0), 0)

  const total = alcance + matRef + pisoMat + instala + pisoFalta + materiales - comprado
  return { quien, alcance, matRef, soloObra, pisoMat, instala, suponeInstala,
           faltanM2, pisoFalta, materiales, comprado, total, lam }
}

/* Lo mismo, pero según quién cotice: es lo que sirve para decidir. */
function vistaEstimadoQuien () {
  const cs = candidatos().filter(c => Object.keys(c.precios).length)
  if (cs.length < 2) return ''
  const filas = cs.map(c => {
    const e = estimado(c.id)
    return { c, e }
  })
  /* Coronar al más barato sólo tiene sentido si cubren lo mismo. Si uno cotizó
     ocho rubros y el otro doce, el «más barato» es el que menos hace. */
  const cubre = (c) => rubrosPorN().filter(x => +c.precios[x.id]).map(x => x.id).sort().join()
  const mismoAlcance = filas.every(f => cubre(f.c) === cubre(filas[0].c))
  const menor = mismoAlcance ? Math.min(...filas.map(f => f.e.total)) : null
  const presta = filas.some(f => f.e.soloObra)
  const cuantos = (c) => rubrosPorN().filter(x => +c.precios[x.id]).length
  return `<table style="margin-top:14px">
      <tr><th>Con quién</th><th>Alcance</th><th>Todo</th></tr>
      ${filas.map(({ c, e }) => `<tr>
        <td>${c.nombre}<br><span class="nada">${e.soloObra
          ? `obra ${nMiles(e.alcance)} + material ${nMiles(e.matRef)}`
          : 'con material'} · cotizó ${cuantos(c)} de ${rubrosPorN().length} rubros</span></td>
        <td>${nPesos(e.alcance + e.matRef)}</td>
        <td${menor !== null && e.total === menor ? ' class="barato"' : ''}>${nPesos(e.total)}</td></tr>`).join('')}
    </table>
    <p class="guia">${presta ? `Al que cotiza <b>sólo mano de obra</b> se le suma el
      <b>material a precios de Guzmán</b>, y nada más de los rubros que él cotizó:
      es la única forma de ponerlos lado a lado. ` : ''}${mismoAlcance
      ? 'Los dos cotizan los mismos rubros, así que el total se compara derecho.'
      : '<b>No cubren lo mismo</b>, así que ninguno sale coronado: el más barato sería ' +
        'el que menos hace. Mira quién cotizó qué en Rubro por rubro, en Candidatos.'}</p>`
}

function vistaEstimado () {
  const e = estimado()
  if (!e.alcance && !e.pisoMat) return ''
  const fila = (que, cuanto, de, signo) => !cuanto ? '' :
    `<tr><td>${que}${de ? `<br><span class="nada">${de}</span>` : ''}</td>
      <td>${signo === '-' ? '−' : ''}${nPesos(Math.abs(cuanto))}</td></tr>`
  return `<div class="tarjeta">
      <h2>Estimado de obra</h2>
      <table>
        ${fila('Los ' + rubrosPorN().length + ' rubros del alcance', e.alcance,
               conPlano() ? 'a las cantidades del plano, precios de Guzmán'
                          : 'cantidades y precios de la cotización de Guzmán')}
        ${fila('Piso nuevo, material', e.pisoMat, `${nMetros(e.lam)} m² de laminado con merma`)}
        ${fila('Ponerlo', e.instala, e.suponeInstala
               ? `supuesto: $${INSTALA_LAMINADO}/m², nadie lo ha cotizado`
               : 'a tu precio de mano de obra')}
        ${fila('Piso duro que el contrato no cubría', e.pisoFalta,
               `${nMetros(e.faltanM2)} m² de más que los 140 cotizados`)}
        ${fila('Material que compras tú', e.materiales, 'la lista de materiales estimados')}
        ${fila('Ya comprado', e.comprado, 'cemento, arena y grava', '-')}
        <tr class="total"><td>Total sin cocina</td><td>${nPesos(e.total)}</td></tr>
      </table>
      ${vistaEstimadoQuien()}
      <p class="guia"><b>No es un presupuesto</b>, es la vara: son los precios de
      una cuadrilla que ya no está. La <b>cocina</b> de VIVANDI va aparte y sin
      número. Y ojo: el pegazulejo de la lista de materiales puede estar ya
      dentro del precio de colocación de loseta.</p>
    </div>`
}

/* El alcance: lo que hay que hacer, con las cantidades y los precios que
   pedía Guzmán. Él ya no está, así que esos precios son sólo referencia —
   sirven para saber si el siguiente cotiza más caro o más barato. */
function vistaAlcance () {
  const rubros = Object.entries(S.rubros || {}).map(([id, r]) => ({ id, ...r }))
    .sort((a, b) => (a.n || 0) - (b.n || 0))
  if (!rubros.length) return '<div class="tarjeta"><p class="guia">Nada todavía.</p></div>'
  const etapas = {}
  for (const r of rubros) (etapas[r.etapa || 'Sin etapa'] = etapas[r.etapa || 'Sin etapa'] || []).push(r)
  let total = 0
  const bloques = Object.entries(etapas).map(([et, rs]) => `
    <div class="tarjeta"><h2>${et}</h2><table>
      ${rs.map(r => {
        const c = (+r.cant || 0) * ((+r.matU || 0) + (+r.moU || 0)); total += c
        return `<tr><td>${r.nombre}<br><span class="nada">${nMetros(r.cant)} ${r.unidad || ''}${
          r.matU || r.moU ? ` · material ${nPesos(r.matU)} + obra ${nPesos(r.moU)} por ${r.unidad || 'unidad'}` : ''}</span></td>
          <td>${nPesos(c)}</td></tr>`
      }).join('')}
    </table></div>`).join('')
  /* El total de arriba se queda con SUS cantidades: es lo que él pedía, tal
     como lo escribió. Lo que mide el plano va al lado, para contrastar. */
  const contraste = rubros.filter(r => MEDIDO[r.n]).map(r =>
    `<tr><td>${r.nombre.slice(0, 40)}</td><td>${nMetros(r.cant)}</td><td>${nMetros(MEDIDO[r.n])}</td></tr>`).join('')
  return vistaEstimado() + `<div class="tarjeta">
      <h2>Lo que pedía Guzmán</h2>
      <table><tr class="total"><td>Los ${rubros.length} rubros</td><td>${nPesos(total)}</td></tr></table>
      <p class="guia">Corriste a esa cuadrilla, así que esto es sólo la vara para
      comparar la cotización del siguiente. El alcance sí sigue en pie.</p>
      ${contraste ? `<table><tr><th>Rubro</th><th>Él medía</th><th>El plano</th></tr>${contraste}</table>
        <p class="guia">Donde el plano mide más, o él midió corto o excluyó áreas.</p>` : ''}
    </div>` + bloques
}

function vistaMateriales () {
  const mats = Object.entries(S.materiales || {}).map(([id, m]) => ({ id, ...m }))
  if (!mats.length) return '<div class="tarjeta"><p class="guia">Nada todavía.</p></div>'
  const grupos = {}
  for (const m of mats) (grupos[m.grupo || 'Sin grupo'] = grupos[m.grupo || 'Sin grupo'] || []).push(m)
  let est = 0
  const bloques = Object.entries(grupos).map(([gr, ms]) => `
    <div class="tarjeta"><h2>${gr}</h2><table>
      ${ms.map(m => { const c = (+m.cant || 0) * (+m.puEst || 0); est += c
        return `<tr><td>${m.nombre}<br><span class="nada">${nMetros(m.cant)} ${m.unidad || ''}${
          m.puEst ? ' · ' + nPesos(m.puEst) + ' c/u' : ''}</span></td><td>${nPesos(c)}</td></tr>` }).join('')}
    </table></div>`).join('')
  const comprado = Object.values(S.gastos).filter(g => g && g.tipo === 'compra')
    .reduce((a, g) => a + (+g.monto || 0), 0)
  return `<div class="tarjeta"><h2>Material</h2>
      <table>
        <tr><td>Estimado</td><td>${nPesos(est)}</td></tr>
        <tr><td>Ya comprado</td><td>${nPesos(comprado)}</td></tr>
        <tr class="total"><td>Falta</td><td>${nPesos(Math.max(0, est - comprado))}</td></tr>
      </table>
      <p class="guia">Lo estimado es de la lista vieja; lo comprado sale de Gastos.</p>
    </div>` + bloques
}

function vistaDudas () {
  const ds = Object.entries(S.dudas || {}).map(([id, d]) => ({ id, ...d }))
  if (!ds.length) return '<div class="tarjeta"><p class="guia">Nada todavía.</p></div>'
  const abiertas = ds.filter(d => d.estatus === 'abierto')
  return `<div class="tarjeta">
      <h2>Dudas · ${abiertas.length} abiertas de ${ds.length}</h2>
      <p class="guia">Salieron de leer la cotización de Guzmán. Varias siguen
      valiendo para el contratista nuevo: son las preguntas que hay que hacerle
      antes de firmar.</p>
    </div>` + ds.map(d => `<div class="tarjeta">
      <p>${d.importa || ''}</p>
      ${d.dice ? `<p class="guia">Decía: ${d.dice}</p>` : ''}
      ${d.impacto ? `<p class="guia">En juego: <b>${d.impacto}</b></p>` : ''}
      <button class="btn" data-duda="${d.id}">${
        d.estatus === 'abierto' ? 'Marcar como aclarada' : 'Volver a abrir'}</button>
    </div>`).join('')
}

/* ------------------------------------------------------------------
   Candidatos y cotizaciones.

   El alcance (los rubros) es de la casa; los precios son de cada quien. Por
   eso el rubro guarda cantidad y unidad, y lo que cobra cada contratista vive
   aparte, en `z:<candidato><rubro>`. Guzmán no se captura: su columna se
   arma sola sumando el material y la obra que traía su cotización, y no se
   deja editar — ya no está, es sólo la vara para medir a los que vienen.   */

/* Lo que el plano mide de esos rubros, contra lo que decía el contrato: el
   alisado de muros (268 m² cotizados) y la pintura (730 m²). Encender el
   interruptor cotiza sobre la casa de verdad y no sobre su medición corta. */
const MEDIDO = { 6: 649.6, 9: 963.6 }
const conPlano = () => !!S.cfg.plano

function cantidadRubro (r) {
  if (!r) return 0
  return (conPlano() && MEDIDO[r.n]) ? MEDIDO[r.n] : (+r.cant || 0)
}
const rubrosPorN = () => Object.entries(S.rubros || {}).map(([id, r]) => ({ id, ...r }))
  .sort((a, b) => (a.n || 0) - (b.n || 0))

const llaveCotiza = (cid, rid) => 'z:' + cid + rid

function candidatos () {
  const guz = { id:'guz', ref:true, nombre:'Guzmán', mat:true,
                nota:'La cotización que ya no corre', precios:{} }
  for (const r of rubrosPorN()) {
    const pu = (+r.matU || 0) + (+r.moU || 0)
    if (pu) guz.precios[r.id] = pu
  }
  const mios = Object.entries(S.candidatos || {})
    .filter(([, c]) => c)
    .map(([id, c]) => ({ id, ref:false, nombre:c.nombre || 'Sin nombre', tel:c.tel || '',
                         nota:c.nota || '', mat:c.mat !== false,
                         precios:(S.cotiza || {})[id] || {} }))
    .sort((a, b) => (+a.id.slice(1) || 0) - (+b.id.slice(1) || 0))
  return (Object.keys(guz.precios).length ? [guz] : []).concat(mios)
}
const totalCandidato = (c) => rubrosPorN()
  .reduce((a, r) => a + cantidadRubro(r) * (+c.precios[r.id] || 0), 0)

function altaCandidato (nombre) {
  let n = 1; while (S.candidatos['c' + n]) n++
  const id = 'c' + n
  pon('k:' + id, { nombre:(nombre || '').trim() || 'Sin nombre' })
  return id
}
/* Se va con todo y precios: si se quedaran, un candidato nuevo podría heredar
   el id y con él las cifras del anterior. */
function bajaCandidato (id) {
  for (const rid in ((S.cotiza || {})[id] || {})) pon(llaveCotiza(id, rid), null)
  pon('k:' + id, null)
}

let candActivo = null

function vistaCandidatos () {
  /* Guzmán no está en S.candidatos —se arma solo—, así que se pregunta por la
     lista ya armada; si no, tocarlo en la lista no abría nada. */
  if (candActivo && candidatos().some(c => c.id === candActivo)) return vistaFicha(candActivo)
  candActivo = null
  const rubros = rubrosPorN()
  if (!rubros.length) return `<div class="tarjeta"><p class="guia">Primero tienen que
    llegar los rubros del alcance.</p></div>`
  const cs = candidatos()
  const ref = cs.find(c => c.ref)
  const tRef = ref ? totalCandidato(ref) : 0

  const filas = cs.map(c => {
    const t = totalCandidato(c)
    /* Comparar un precio de sólo mano de obra contra uno con material da un
       porcentaje que miente. Mejor decir que no se comparan. */
    const mismaBase = ref && c.mat === ref.mat
    const dif = (tRef && !c.ref && t && mismaBase) ? Math.round((t / tRef - 1) * 100) : null
    const otra = !c.ref && t && !mismaBase
    return `<tr><td><a href="#" data-cand="${c.id}">${c.nombre}</a>${
      c.ref ? '<br><span class="nada">la vara, no se edita</span>'
            : (c.mat ? '' : '<br><span class="nada">sólo mano de obra</span>')}</td>
      <td>${t ? nPesos(t) : '<span class="nada">sin cotizar</span>'}${
        otra ? '<br><span class="nada">otra base, no se compara</span>'
        : dif === null ? '' : `<br><span class="${dif < 0 ? 'barato' : 'nada'}">${
        dif > 0 ? '+' : ''}${dif}% vs. Guzmán</span>`}</td></tr>`
  }).join('')

  return `<div class="tarjeta">
      <h2>Cotizaciones · ${rubros.length} rubros</h2>
      <table class="cotiza"><tr><th>Quién</th><th>Total</th></tr>${filas}</table>
      <label class="interruptor" style="margin-top:12px">
        <input type="checkbox" id="cand-plano"${conPlano() ? ' checked' : ''}>
        Cotizar con las cantidades del plano</label>
      <p class="guia">${conPlano()
        ? 'Los rubros que el plano mide van con su medida: alisado 649.6 m² y pintura 963.6 m².'
        : 'Van las cantidades del contrato viejo. Ojo: él cotizó 730 m² de pintura y el plano mide 963.6.'}</p>
    </div>
    <div class="tarjeta">
      <h2>Agregar candidato</h2>
      <label class="campo">Nombre <input id="cand-nombre" placeholder="Albañil, constructora…"></label>
      <button class="btn fuerte" id="cand-nuevo" style="margin-top:10px">Agregar</button>
      <p class="guia">Luego le capturas su precio por rubro y la app lo compara.</p>
    </div>` + vistaComparar(cs, rubros)
}

/* La comparación sólo dice algo cuando hay con quién comparar. */
function vistaComparar (cs, rubros) {
  const conPrecio = cs.filter(c => Object.keys(c.precios).length)
  if (conPrecio.length < 2) return ''
  const filas = rubros.map(r => {
    const precios = conPrecio.map(c => +c.precios[r.id] || 0)
    const hay = precios.filter(x => x > 0)
    const min = hay.length > 1 ? Math.min(...hay) : 0   // solo uno no es el más barato
    return `<tr data-fila="${r.id}">
      <td>${r.nombre.slice(0, 34)}<br><span class="nada">${nMetros(cantidadRubro(r))} ${r.unidad || ''}</span></td>
      ${conPrecio.map((c, i) => `<td${precios[i] && precios[i] === min ? ` class="barato" data-de="${c.id}"` : ''}>${
        precios[i] ? nMetros(precios[i]) : '<span class="nada">—</span>'}</td>`).join('')}</tr>`
  }).join('')
  const totales = conPrecio.map(c => totalCandidato(c))
  const menor = Math.min(...totales.filter(x => x > 0))
  return `<div class="tarjeta">
      <h2>Rubro por rubro</h2>
      <table class="comparar">
        <tr><th>Rubro</th>${conPrecio.map(c => { const n = c.nombre.split(' ')[0]
          return `<th>${n.length > 9 ? n.slice(0, 8) + '.' : n}${
            c.mat ? '' : '<br>sólo obra'}</th>` }).join('')}</tr>
        ${filas}
        <tr class="total"><td>Total</td>${totales.map((t, i) =>
          `<td${t && t === menor ? ' class="barato"' : ''}>${nMiles(t)}</td>`).join('')}</tr>
      </table>
      <p class="guia">Pesos por unidad de cada quien, y abajo el total; en negritas
      el más barato de cada renglón. <b>Ojo si una columna dice «sólo obra»</b>:
      ésa no trae material y no se compara de tú a tú con una que sí. Barato por rubro no es barato en total — mira las dos cosas.</p>
    </div>`
}

function vistaFicha (cid) {
  const c = candidatos().find(x => x.id === cid)
  if (!c) { candActivo = null; return vistaCandidatos() }
  const ref = candidatos().find(x => x.ref)
  const etapas = {}
  for (const r of rubrosPorN()) (etapas[r.etapa || 'Sin etapa'] = etapas[r.etapa || 'Sin etapa'] || []).push(r)
  const bloques = Object.entries(etapas).map(([et, rs]) => `
    <div class="tarjeta"><h2>${et}</h2><table>
      ${rs.map(r => {
        const suyo = +c.precios[r.id] || 0
        const deRef = c.ref ? 0 : (ref && +ref.precios[r.id] || 0)   // en su propia ficha sobra
        return `<tr><td>${r.nombre}<br><span class="nada">${nMetros(cantidadRubro(r))} ${r.unidad || ''}${
          deRef ? ` · Guzmán ${nPesos(deRef)}` : ''}</span></td>
          <td>${c.ref ? nPesos(suyo)
            : `<input class="pu" type="number" inputmode="decimal" step="any" min="0"
                 data-cotiza="${r.id}" value="${suyo || ''}" placeholder="0">`}</td>
          <td>${suyo ? nPesos(suyo * cantidadRubro(r)) : '<span class="nada">—</span>'}</td></tr>`
      }).join('')}
    </table></div>`).join('')

  return `<a href="#" id="cand-atras" class="atras">‹ Candidatos</a>
    <div class="tarjeta">
      <h2>${c.nombre}</h2>
      ${c.ref ? `<p class="guia">Es la cotización de Guzmán, la que ya no corre. No se
        edita: sirve de vara. Sus precios traen material y mano de obra juntos.</p>`
      : `<label class="campo">Nombre <input data-campo="nombre" value="${c.nombre}"></label>
         <label class="campo">Teléfono <input data-campo="tel" value="${c.tel}"></label>
         <label class="campo">Nota <input data-campo="nota" value="${c.nota}" placeholder="quién lo recomendó, qué prometió…"></label>
         <label class="interruptor" style="margin-top:10px">
           <input type="checkbox" id="cand-mat"${c.mat ? ' checked' : ''}>
           Sus precios incluyen el material</label>`}
      <table style="margin-top:10px"><tr class="total"><td>Total</td>
        <td id="cand-total">${nPesos(totalCandidato(c))}</td></tr></table>
      <p class="guia">Precio por unidad, ${c.mat ? 'con material incluido' :
        '<b>sólo mano de obra</b> — el material lo compras tú'}. ${
        conPlano() ? 'Cantidades del plano.' : 'Cantidades del contrato viejo.'}</p>
    </div>` + bloques + (c.ref ? '' : `
    <div class="tarjeta">
      <button class="btn" data-borra="${c.id}">Quitar a ${c.nombre}</button>
      <p class="guia">Se va con sus precios. El alcance no se toca.</p>
    </div>`)
}

function enganchaCandidatos () {
  const n = document.getElementById('mas')
  const nuevo = document.getElementById('cand-nuevo')
  if (nuevo) nuevo.onclick = () => {
    const campo = document.getElementById('cand-nombre')
    candActivo = altaCandidato(campo.value); campo.value = ''; dibujaMas()
  }
  const plano = document.getElementById('cand-plano')
  if (plano) plano.onchange = () => { pon('c:plano', plano.checked); dibujaMas() }
  n.querySelectorAll('[data-cand]').forEach(a => a.onclick = (ev) => {
    ev.preventDefault(); candActivo = a.dataset.cand; dibujaMas()
  })
  const mat = document.getElementById('cand-mat')
  if (mat) mat.onchange = () => {
    pon('k:' + candActivo, { ...(S.candidatos[candActivo] || {}), mat:mat.checked })
    dibujaMas()
  }
  const atras = document.getElementById('cand-atras')
  if (atras) atras.onclick = (ev) => { ev.preventDefault(); candActivo = null; dibujaMas() }
  n.querySelectorAll('[data-borra]').forEach(b => b.onclick = () => {
    bajaCandidato(b.dataset.borra); candActivo = null; dibujaMas()
  })
  n.querySelectorAll('[data-campo]').forEach(i => i.onchange = () => {
    const c = S.candidatos[candActivo] || {}
    pon('k:' + candActivo, { ...c, [i.dataset.campo]:i.value.trim() })
  })
  /* Al salir del campo se guarda; mientras teclea sólo se recalcula el total,
     para no mandar un hecho por cada tecla. */
  n.querySelectorAll('[data-cotiza]').forEach(i => {
    i.onchange = () => {
      const v = parseFloat(i.value)
      pon(llaveCotiza(candActivo, i.dataset.cotiza), v > 0 ? v : null)
      dibujaMas()
    }
    i.oninput = () => {
      const c = candidatos().find(x => x.id === candActivo); if (!c) return
      const precios = { ...c.precios, [i.dataset.cotiza]:parseFloat(i.value) || 0 }
      const t = rubrosPorN().reduce((a, r) => a + cantidadRubro(r) * (+precios[r.id] || 0), 0)
      const caja = document.getElementById('cand-total'); if (caja) caja.textContent = nPesos(t)
    }
  })
}

/* ------------------------------------------------------------------
   Ajustes. La clave es la que abre la sala: la misma para los dos
   teléfonos. No viaja en el HTML — vive sólo en cada teléfono.        */
function vistaAjustes () {
  const hay = !!T.clave
  return `
    <div class="tarjeta">
      <h2>Compartir con Denise</h2>
      <label class="campo">Clave de la casa
        <input id="a-clave" type="password" autocomplete="off"
               placeholder="${hay ? 'guardada en este teléfono' : 'escríbela'}"></label>
      <button class="btn" id="a-poner" style="margin-top:10px">${hay ? 'Cambiar la clave' : 'Conectar'}</button>
      <p class="guia">Quien escriba la misma clave ve lo mismo. ${
        hay ? `Estado: <b>${sync.estado}</b>${sync.ultimo ? ' · al día hace ' +
          Math.round((Date.now()-sync.ultimo)/1000) + ' s' : ''}. Sala ${T.sala.slice(0, 9)}…` :
        'Sin clave, todo se queda en este teléfono.'}</p>
    </div>

    <div class="tarjeta">
      <h2>Quién puede desembolsar</h2>
      <label class="campo">Separados por coma
        <input id="a-pagadores" value="${pagadores().join(', ')}"></label>
      <button class="btn" id="a-guardar-pag" style="margin-top:10px">Guardar</button>
    </div>

    <div class="tarjeta">
      <h2>De dónde sale todo</h2>
      <p class="guia">Las cantidades salen de tus planos a escala 1:50 y las cuentas
      de lo que tú escribas aquí. El gasto viene de la app de obra.</p>
      <button class="btn" id="a-version" style="margin-top:10px">Buscar versión nueva</button>
      <p class="guia">La app guarda una copia en el teléfono para abrir sin red,
      así que una versión nueva se ve hasta el segundo arranque. Esto la fuerza.</p>
    </div>`
}
function enganchaAjustes () {
  document.getElementById('a-version').onclick = async () => {
    try { for (const k of await caches.keys()) await caches.delete(k) } catch (e) {}
    location.reload()
  }
  document.getElementById('a-poner').onclick = () => {
    const v = document.getElementById('a-clave').value
    if (!v.trim()) { alert('Escribe la clave.'); return }
    ponClave(v); dibujaMas()
  }
  document.getElementById('a-guardar-pag').onclick = () => {
    pon('c:pagadores', document.getElementById('a-pagadores').value
      .split(',').map(x => x.trim()).filter(Boolean))
    dibujaMas()
  }
}

function pintaEstado () {
  const n = document.getElementById('estado'); if (!n) return
  const mapa = { 'sin clave':'· sólo aquí', 'conectando':'· conectando', 'en vivo':'· en vivo', 'sin señal':'· sin señal' }
  n.textContent = mapa[sync.estado] || ''
  n.className = 'estado' + (sync.estado === 'en vivo' ? ' vivo' : sync.estado === 'sin señal' ? ' malo' : '')
}

/* Nadie redibuja encima del que está tecleando. El sync entra cada 20 segundos
   y la pantalla se rehace con innerHTML: si el cursor está en un campo de esa
   vista —el monto de un gasto, el precio por m² de un candidato— lo escrito se
   volatiliza. Se apunta la vista y se redibuja en cuanto suelte el campo. */
let porRedibujar = null
const tecleando = (n) => {
  const a = document.activeElement
  return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && n.contains(a)
}
addEventListener('focusout', () => {
  /* focusout llega ANTES de que el foco aterrice en el campo siguiente, así que
     se pregunta un instante después; si sólo cambió de campo, no se redibuja. */
  setTimeout(() => {
    const v = porRedibujar; if (!v) return
    const n = document.getElementById(v)
    if (n && n.classList.contains('activa') && !tecleando(n)) { porRedibujar = null; refrescaTodo() }
  }, 0)
})

function refrescaTodo () {
  if (typeof niveles === 'undefined') return
  for (const tag of ['pb', 'n1']) if (niveles[tag] && niveles[tag].listo) tinta(tag)
  if (niveles[nivelActivo] && niveles[nivelActivo].listo) pinta()
  for (const [v, f] of [['resumen', dibujaResumen], ['gastos', dibujaGastos], ['mas', dibujaMas]]) {
    const n = document.getElementById(v)
    if (!n || !n.classList.contains('activa')) continue
    if (tecleando(n)) { porRedibujar = v; continue }
    f()
  }
  pintaEstado()
}

/* ------------------------------------------------------------------
   Pestañas                                                           */
const NIVELES = { pb: 'Planta baja', n1: 'Primer nivel' }
function avisaNivel (cual) {
  const av = document.getElementById('aviso'); if (!av) return
  av.innerHTML = `<b>${NIVELES[cual || nivelActivo]}</b> · toca un espacio para darle piso.`
}

function muestra (cual) {
  const nav = document.getElementById('pestanas')
  /* Los botones, no todos los hijos: el separador de grupos no es una pestaña. */
  nav.querySelectorAll('button').forEach(x => {
    const suya = x.dataset.vista === cual
    x.setAttribute('aria-selected', suya)
    x.tabIndex = suya ? 0 : -1
  })
  const activa = nav.querySelector('[aria-selected="true"]')
  if (activa) activa.scrollIntoView({ block:'nearest', inline:'nearest' })
  const esMapa = cual === 'pb' || cual === 'n1'
  if (esMapa) avisaNivel(cual)
  /* Por id, no por [data-vista]: ese atributo lo llevan también las pestañas. */
  document.getElementById('vista-mapa').classList.toggle('activa', esMapa)
  for (const v of ['resumen', 'gastos', 'mas'])
    document.getElementById(v).classList.toggle('activa', v === cual)
  if (esMapa) {
    if (cual !== nivelActivo) { nivelActivo = cual; if (!niveles[cual]) cargaNivel(cual); ajusta() }
    else pinta()
  }
  else if (cual === 'resumen') dibujaResumen()
  else if (cual === 'gastos') dibujaGastos()
  else dibujaMas()
}
document.getElementById('pestanas').onclick = ev => {
  const b = ev.target.closest('button'); if (b) muestra(b.dataset.vista)
}

/* Copia local, para que abra aunque la red falle. Sólo en https: en un
   archivo local el navegador no la permite. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const habia = !!navigator.serviceWorker.controller
  let recargando = false
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    /* Sólo si YA había una copia: en la primera instalación no hay que
       recargar, y hacerlo dejaría la app en un bucle. */
    if (habia && !recargando) { recargando = true; location.reload() }
  })
  navigator.serviceWorker.register('sw.js').catch(() => {})
}

/* Si ya había clave guardada, se conecta sola al abrir. */
if (T.clave) { T.sala = salaDe(T.clave); sync.estado = 'conectando'; programarSync(400) }
pintaEstado()

avisaNivel()
cargaNivel('pb'); cargaNivel('n1')
const cuandoCargue = setInterval(() => {
  if (!niveles.pb.listo || !niveles.n1.listo) return
  clearInterval(cuandoCargue)
  tinta('pb'); tinta('n1'); ajusta(); dibujaResumen()
}, 30)
</script>
